name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loose
          POSTGRES_PASSWORD: loose
          POSTGRES_DB: loose
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loose -d loose"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test-only values for throwaway CI services; not secrets.
      DATABASE_URL: postgresql://loose:loose@127.0.0.1:5432/loose
      TEST_DATABASE_URL: postgresql://loose:loose@127.0.0.1:5432/loose_test
      REDIS_URL: redis://127.0.0.1:6379
      TURBO_TELEMETRY_DISABLED: '1'
      # Server tests pin their own sandbox/agent config (fake provider, RUNNER_MOCK); set
      # here too so nothing ever falls back to e2b/Anthropic in CI.
      SANDBOX_PROVIDER: fake
      RUNNER_MOCK: 'true'
      # Git identity for temp repos created by the runner / e2e tests.
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@example.com
      # test/e2e.local.test.ts uses the dev-only local provider + mock runner explicitly,
      # which needs git and the built packages/runner/dist/cli.js (Build runs before Test).

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      # The server test globalSetup creates loose_test and runs `prisma migrate deploy`
      # against it; this step also checks the migrations apply cleanly to a fresh DB.
      - name: Apply migrations
        run: bun run --cwd apps/server prisma:deploy

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Build before testing: the server's local e2e test spawns packages/runner/dist/cli.js.
      - name: Build
        run: bun run build

      - name: Test
        run: bun run test -- -- --maxWorkers=2

      # Blocking: the tree is audit-clean (see "Dependency overrides" in README.md).
      - name: Dependency audit
        run: bun audit
