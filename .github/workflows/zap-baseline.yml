# OWASP ZAP baseline scan against a running (staging) instance. Never run against production,
# and never auto-triggered — the design explicitly calls for staging-only, on-demand DAST
# (phase10-design.md §7.7; BRIEF.md "never run a real load/pen test locally").
name: ZAP Baseline Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Base URL of the staging deployment to scan (e.g. https://staging.loose.ai)'
        required: true
        type: string
      fail_on_warn:
        description: 'Fail the job on ZAP WARN-level findings too (default: only FAIL-level)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Guard against accidental production target
        run: |
          case "${{ inputs.target_url }}" in
            *"://app.loose.ai"*|*"://loose.ai"*)
              echo "::error::target_url looks like production. This workflow is staging-only." >&2
              exit 1
              ;;
          esac

      # The ZAP baseline passive-scans the target plus a short active spider; it does not run
      # the full active scan (which can mutate data) and respects .zap/rules.tsv for
      # known/accepted findings (documented with a reason in that file).
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: ${{ inputs.fail_on_warn && 'true' || 'false' }}

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: ignore
          retention-days: 30
